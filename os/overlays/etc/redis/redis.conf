# Default Redis config for BigFred hub. Seeded to /data/etc/redis.conf on
# first boot (early-boot.sh) or first redis start (redis). Edit the copy
# under /data to tune persistence without touching the read-only rootfs.

bind 127.0.0.1
port 6379
daemonize no
supervised no
dir /data/var/db/redis
dbfilename dump.rdb

# RDB only — limit disk writes vs AOF; snapshot when >=100 changes in 120s.
appendonly no
save 120 100
rdbcompression yes
stop-writes-on-bgsave-error no

logfile /data/logs/redis/redis.log
notify-keyspace-events "KA"
