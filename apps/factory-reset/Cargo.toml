[package]
name = "factory-reset"
version = "0.1.0"
edition = "2021"
description = "Wipe /data contents and reboot on BigFred OS (operator tool)"
license = "MIT"
publish = false

[[bin]]
name = "factory-reset"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
panic = "abort"
